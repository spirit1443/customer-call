<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>고객 연락</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --red:#c0392b; --bg:#f4f4f6; --card:#fff; --text:#222; --sub:#777; --line:#e3e3e8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
  header { position:sticky; top:0; z-index:5; background:var(--red); color:#fff; padding:12px 16px; display:flex; gap:8px; align-items:center; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header button, header label { background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:8px; padding:8px 10px; font-size:14px; cursor:pointer; }
  main { padding:12px 16px 80px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  details summary { font-weight:600; cursor:pointer; padding:4px 0; }
  .tpl { border-top:1px solid var(--line); padding:8px 0; }
  .tpl b { display:block; font-size:14px; }
  .tpl p { margin:4px 0; font-size:14px; color:var(--sub); white-space:pre-wrap; }
  input, select, textarea { width:100%; font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:70px; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; }
  .btn { border:0; border-radius:8px; padding:10px 14px; font:inherit; font-size:15px; cursor:pointer; background:#eee; color:var(--text); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:4px; }
  .btn.primary { background:var(--red); color:#fff; }
  .btn.sm { padding:6px 10px; font-size:13px; }
  .filters { display:flex; gap:6px; margin:10px 0; }
  .filters button { flex:1; border:1px solid var(--line); background:#fff; border-radius:20px; padding:8px; font:inherit; font-size:14px; }
  .filters button.on { background:var(--red); color:#fff; border-color:var(--red); }
  .cust { display:flex; gap:8px; align-items:center; }
  .cust .info { flex:1; min-width:0; cursor:pointer; }
  .cust .name { font-weight:600; }
  .cust .meta { font-size:13px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .icon { width:44px; height:44px; border-radius:50%; font-size:20px; padding:0; }
  .badge { display:inline-block; font-size:12px; padding:2px 6px; border-radius:10px; background:#fdecea; color:var(--red); margin-left:4px; }
  .badge.gray { background:#eee; color:var(--sub); }
  #detail, #picker { position:fixed; inset:0; background:var(--bg); z-index:10; overflow-y:auto; display:none; }
  #picker { background:rgba(0,0,0,.4); z-index:20; }
  #picker .sheet { position:absolute; bottom:0; left:0; right:0; max-height:80%; overflow-y:auto; background:#fff; border-radius:16px 16px 0 0; padding:16px; }
  .kv { display:grid; grid-template-columns:100px 1fr; gap:4px 8px; font-size:14px; }
  .kv dt { color:var(--sub); } .kv dd { margin:0; word-break:break-all; }
  .actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .actions .btn { padding:14px 0; font-size:16px; }
  .memo { border-top:1px solid var(--line); padding:8px 0; font-size:14px; }
  .memo .when { color:var(--sub); font-size:12px; }
  .memo .del { float:right; background:none; border:0; color:#aaa; font-size:16px; cursor:pointer; }
  .empty { text-align:center; color:var(--sub); padding:40px 0; }
  .muted { color:var(--sub); font-size:13px; }
</style>
</head>
<body>

<header>
  <h1>고객 연락</h1>
  <label>엑셀 불러오기<input type="file" id="file" hidden></label>
  <button id="exportBtn">내보내기</button>
</header>

<main>
  <details class="card" id="tplBox">
    <summary>💬 문자 문구 (<span id="tplCount">0</span>)</summary>
    <div id="tplList"></div>
    <div class="tpl">
      <input id="tplTitle" placeholder="문구 제목">
      <textarea id="tplBody" placeholder="내용 — {이름} 은 고객 이름으로 바뀝니다. 엑셀 열 이름도 {열이름} 으로 쓸 수 있어요."></textarea>
      <div class="row" style="margin-top:6px">
        <button class="btn primary" id="tplSave">문구 저장</button>
        <button class="btn" id="tplCancel" hidden>취소</button>
      </div>
    </div>
  </details>

  <input id="search" type="search" placeholder="이름 · 번호 · 주소 검색">
  <div class="filters">
    <button data-f="all" class="on">전체</button>
    <button data-f="none">미연락</button>
    <button data-f="absent">부재</button>
  </div>
  <div id="list"></div>
</main>

<section id="detail"></section>
<section id="picker"><div class="sheet" id="pickerSheet"></div></section>

<script>
const KEY = 'customer-app-v1';
const EXTRA_COLS = ['방문가능시간', '부재횟수', '최근연락일'];
const DEFAULT_TEMPLATES = [
  { title: '점검 일정 안내', body: '안녕하세요 {이름}님, 소방시설 정기점검 일정 안내차 연락드립니다.\n편하신 방문 가능 날짜와 시간을 알려주시면 맞춰서 방문드리겠습니다.\n감사합니다.' },
  { title: '부재 시 문자', body: '안녕하세요 {이름}님, 소방점검 관련으로 전화드렸는데 통화가 어려우셔서 문자 남깁니다.\n편하실 때 회신 부탁드립니다. 감사합니다.' },
  { title: '방문 일정 확정', body: '{이름}님, 말씀하신 일정에 소방점검 방문 예정입니다.\n변동 사항 있으시면 연락 부탁드립니다. 감사합니다.' },
  { title: '점검 완료 감사', body: '{이름}님, 오늘 소방점검에 협조해주셔서 감사합니다.\n궁금하신 점 있으시면 언제든 연락주세요.' },
];

// ---------- 저장소 (폰 안에만) ----------
let S = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.customers) return s;
  } catch (e) {}
  return { customers: [], memos: [], templates: DEFAULT_TEMPLATES.slice(), columns: [], nameCol: '', phoneCol: '', offices: {} };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { alert('저장 실패: 폰 저장공간을 확인해주세요. 지금 엑셀로 내보내기를 해두세요.'); }
}

// ---------- 유틸 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
function normPhone(v) {
  let d = String(v ?? '').replace(/\D/g, '');
  if (/^1\d{8,9}$/.test(d)) d = '0' + d; // 엑셀이 숫자로 저장해 앞자리 0이 빠진 경우
  return d.length >= 8 ? d : '';
}
function fmtPhone(d) {
  if (/^02/.test(d)) return d.replace(/^(02)(\d{3,4})(\d{4})$/, '$1-$2-$3');
  return d.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
}
function fmtDate(iso, full) {
  const d = new Date(iso), p = n => String(n).padStart(2, '0');
  const t = `${p(d.getHours())}:${p(d.getMinutes())}`;
  return full ? `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${t}` : `${d.getMonth()+1}/${d.getDate()} ${t}`;
}
const colLike = re => S.columns.find(c => c !== S.phoneCol && c !== S.nameCol && re.test(c));
const placeCol = () => colLike(/단지|건물|상호|업체|회사/) || colLike(/주소/);
const statusCol = () => colLike(/설치|상태|진행|결과/);
const normPlace = s => String(s ?? '').replace(/\s|-|아파트/g, '').toLowerCase();
const officeOf = c => { const p = placeCol(); return p ? (S.offices || {})[normPlace(c.data[p])] : ''; };
const unitOf = c => [c.data['동'] && c.data['동'] + '동', (c.data['호수'] || c.data['호']) && (c.data['호수'] || c.data['호']) + '호'].filter(Boolean).join(' ');
const isAbsent = c => absentCount(c.phone) > 0 || (statusCol() && String(c.data[statusCol()]).includes('부재'));
const nameOf = c => (S.nameCol && c.data[S.nameCol]) || fmtPhone(c.phone);
const memosOf = phone => S.memos.filter(m => m.phone === phone).sort((a, b) => b.date.localeCompare(a.date));
const absentCount = phone => S.memos.filter(m => m.phone === phone && m.type === '부재').length;
const lastContact = phone => memosOf(phone)[0]?.date || '';
const findCust = phone => S.customers.find(c => c.phone === phone);

function fillTemplate(body, c) {
  return body.replace(/\{([^}]+)\}/g, (m, k) => {
    if (k === '이름') return S.nameCol ? (c.data[S.nameCol] ?? '') : '';
    return k in c.data ? c.data[k] : m;
  });
}
function addMemo(phone, type, text) {
  S.memos.push({ id: Date.now() + '' + Math.random().toString(36).slice(2, 6), phone, date: new Date().toISOString(), type, text: text || '' });
  save();
}

// ---------- 엑셀 불러오기 (전화번호 기준 병합) ----------
function detectCols(cols, rows) {
  const phoneCol = cols.find(c => /전화|연락처|휴대|핸드폰|폰|phone|tel|mobile/i.test(c))
    || cols.find(c => rows.slice(0, 20).filter(r => normPhone(r[c])).length >= Math.min(3, rows.length));
  const nameCol = cols.find(c => c !== phoneCol && /이름|성명|고객명|담당자|대표자|name/i.test(c))
    || cols.find(c => c !== phoneCol && /상호|업체|건물|회사|대상/i.test(c))
    || cols.find(c => c !== phoneCol) || '';
  return { phoneCol, nameCol };
}

function importWorkbook(wb) {
  const custSheet = wb.Sheets['고객'] || wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(custSheet, { defval: '', raw: false });
  if (!rows.length) return alert('엑셀에 데이터가 없어요.');
  const cols = Object.keys(rows[0]).filter(c => !EXTRA_COLS.includes(c) && !/^__EMPTY/.test(c));
  const { phoneCol, nameCol } = detectCols(cols, rows);
  if (!phoneCol) return alert('전화번호 열을 찾지 못했어요. 열 제목에 "전화" 또는 "연락처"를 넣어주세요.');

  S.phoneCol = phoneCol; S.nameCol = nameCol;
  cols.forEach(c => { if (!S.columns.includes(c)) S.columns.push(c); });

  let added = 0, updated = 0, skipped = 0;
  const seen = {}; // 한 파일 안에 같은 번호가 여러 줄이면 값을 "A / B"로 합침
  for (const r of rows) {
    const phone = normPhone(r[phoneCol]);
    if (!phone) { skipped++; continue; }
    const data = {};
    cols.forEach(c => data[c] = r[c]);
    if (seen[phone]) {
      cols.forEach(c => { const a = String(seen[phone].data[c] ?? ''), b = String(data[c] ?? '');
        if (b && !a.split(' / ').includes(b)) seen[phone].data[c] = a ? a + ' / ' + b : b; });
      continue;
    }
    const ex = findCust(phone);
    if (ex) { cols.forEach(k => { if (data[k] !== '') ex.data[k] = data[k]; }); updated++; if (r['방문가능시간']) ex.visitTime = r['방문가능시간']; seen[phone] = ex; }
    else { seen[phone] = { phone, data, visitTime: r['방문가능시간'] || '' }; S.customers.push(seen[phone]); added++; }
  }

  // "관리사무실" 시트가 있으면 단지명 → 관리사무실 번호
  const offName = wb.SheetNames.find(n => n.includes('관리사무'));
  if (offName) {
    S.offices = S.offices || {};
    for (const r of XLSX.utils.sheet_to_json(wb.Sheets[offName], { header: 1, defval: '', raw: false }).slice(1)) {
      const p = normPhone(r[1]); if (r[0] && p) S.offices[normPlace(r[0])] = p;
    }
  }

  // 내보낸 백업 파일이면 메모도 복원 (같은 기록은 중복 추가 안 함)
  let memoAdded = 0;
  if (wb.Sheets['메모']) {
    const have = new Set(S.memos.map(m => m.phone + '|' + fmtDate(m.date, true) + '|' + m.type + '|' + m.text));
    for (const r of XLSX.utils.sheet_to_json(wb.Sheets['메모'], { defval: '', raw: false })) {
      const phone = normPhone(r['전화번호']);
      if (!phone || !r['일시']) continue;
      const d = new Date(String(r['일시']).replace(' ', 'T'));
      if (isNaN(d)) continue;
      const k = phone + '|' + fmtDate(d.toISOString(), true) + '|' + r['종류'] + '|' + r['내용'];
      if (have.has(k)) continue;
      have.add(k);
      S.memos.push({ id: 'i' + Date.now() + memoAdded, phone, date: d.toISOString(), type: r['종류'] || '기타', text: r['내용'] || '' });
      memoAdded++;
    }
  }
  save(); render();
  alert(`불러오기 완료\n신규 ${added}명 · 갱신 ${updated}명` + (skipped ? ` · 번호없음 ${skipped}건 제외` : '') + (memoAdded ? `\n메모 ${memoAdded}건 복원` : '') + `\n\n이름 열: ${nameCol || '없음'} / 번호 열: ${phoneCol}`);
}

$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { importWorkbook(XLSX.read(await f.arrayBuffer())); }
  catch (err) { alert('엑셀을 읽지 못했어요: ' + err.message); }
  e.target.value = '';
};

// ---------- 엑셀 내보내기 ----------
$('#exportBtn').onclick = () => {
  if (!S.customers.length) return alert('내보낼 고객이 없어요.');
  const cust = S.customers.map(c => {
    const o = {};
    S.columns.forEach(k => o[k] = c.data[k] ?? '');
    o['방문가능시간'] = c.visitTime || '';
    o['부재횟수'] = absentCount(c.phone);
    const lc = lastContact(c.phone);
    o['최근연락일'] = lc ? fmtDate(lc, true) : '';
    return o;
  });
  const memos = S.memos.slice().sort((a, b) => a.date.localeCompare(b.date)).map(m => ({
    '일시': fmtDate(m.date, true), '이름': findCust(m.phone) ? nameOf(findCust(m.phone)) : '',
    '전화번호': fmtPhone(m.phone), '종류': m.type, '내용': m.text,
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cust), '고객');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(memos.length ? memos : [{ '일시':'', '이름':'', '전화번호':'', '종류':'', '내용':'' }]), '메모');
  XLSX.writeFile(wb, `고객관리_${fmtDate(new Date().toISOString(), true).slice(0, 10)}.xlsx`);
};

// ---------- 문구 템플릿 ----------
let editingTpl = -1;
function renderTemplates() {
  $('#tplCount').textContent = S.templates.length;
  $('#tplList').innerHTML = S.templates.map((t, i) => `
    <div class="tpl"><b>${esc(t.title)}</b><p>${esc(t.body)}</p>
      <button class="btn sm" data-edit="${i}">수정</button>
      <button class="btn sm" data-del="${i}">삭제</button></div>`).join('');
}
$('#tplList').onclick = e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed != null) {
    editingTpl = +ed;
    $('#tplTitle').value = S.templates[ed].title; $('#tplBody').value = S.templates[ed].body;
    $('#tplCancel').hidden = false; $('#tplTitle').focus();
  }
  if (del != null && confirm(`"${S.templates[del].title}" 문구를 삭제할까요?`)) { S.templates.splice(del, 1); save(); renderTemplates(); }
};
function resetTplForm() { editingTpl = -1; $('#tplTitle').value = ''; $('#tplBody').value = ''; $('#tplCancel').hidden = true; }
$('#tplSave').onclick = () => {
  const title = $('#tplTitle').value.trim(), body = $('#tplBody').value.trim();
  if (!body) return alert('내용을 입력해주세요.');
  const t = { title: title || body.slice(0, 15), body };
  if (editingTpl >= 0) S.templates[editingTpl] = t; else S.templates.push(t);
  save(); resetTplForm(); renderTemplates();
};
$('#tplCancel').onclick = resetTplForm;

// ---------- 전화 / 문자 ----------
function call(phone) {
  addMemo(phone, '전화', '전화 발신');
  location.href = 'tel:' + phone;
  refresh();
}
function openPicker(phone) {
  const c = findCust(phone);
  $('#pickerSheet').innerHTML = `
    <div class="row" style="margin-bottom:8px"><b style="flex:1">${esc(nameOf(c))}님께 문자</b><button class="btn sm" id="pickClose">닫기</button></div>
    ${S.templates.map((t, i) => `<div class="tpl" data-pick="${i}" style="cursor:pointer"><b>${esc(t.title)}</b><p>${esc(fillTemplate(t.body, c))}</p></div>`).join('')}
    <div class="tpl" data-pick="-1" style="cursor:pointer"><b>빈 문자 (직접 작성)</b></div>`;
  $('#picker').style.display = 'block';
  $('#pickClose').onclick = closePicker;
  $('#pickerSheet').querySelectorAll('[data-pick]').forEach(el => el.onclick = () => {
    const i = +el.dataset.pick;
    const body = i >= 0 ? fillTemplate(S.templates[i].body, c) : '';
    addMemo(phone, '문자', i >= 0 ? `[${S.templates[i].title}] ${body}` : '문자 작성');
    closePicker();
    location.href = `sms:${phone}${body ? '?body=' + encodeURIComponent(body) : ''}`;
    refresh();
  });
}
function closePicker() { $('#picker').style.display = 'none'; }
$('#picker').onclick = e => { if (e.target.id === 'picker') closePicker(); };

// ---------- 고객 목록 ----------
let filter = 'all';
document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
  filter = b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.classList.toggle('on', x === b));
  renderList();
});
$('#search').oninput = renderList;

function renderList() {
  if (!S.customers.length) {
    $('#list').innerHTML = `<div class="empty">오른쪽 위 <b>엑셀 불러오기</b>로<br>고객 명단을 넣어주세요.</div>`;
    return;
  }
  const pc = placeCol(), sc = statusCol();
  const q = $('#search').value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  let list = S.customers.filter(c => {
    if (filter === 'none' && (lastContact(c.phone) || (sc && c.data[sc]))) return false;
    if (filter === 'absent' && !isAbsent(c)) return false;
    if (!q) return true;
    return (qd && c.phone.includes(qd)) || Object.values(c.data).some(v => String(v).toLowerCase().includes(q));
  });
  $('#list').innerHTML = `<p class="muted">${list.length}명</p>` + list.map(c => {
    const ab = absentCount(c.phone), lc = lastContact(c.phone), st = sc && c.data[sc];
    const where = [pc && c.data[pc], unitOf(c)].filter(Boolean).join(' ');
    return `<div class="card cust">
      <div class="info" data-open="${c.phone}">
        <div class="name">${esc(nameOf(c))}${ab ? `<span class="badge">부재 ${ab}</span>` : ''}${st ? `<span class="badge gray">${esc(st)}</span>` : ''}${lc || st ? '' : '<span class="badge gray">미연락</span>'}</div>
        <div class="meta">${fmtPhone(c.phone)}${where ? ' · ' + esc(where) : ''}</div>
        ${c.visitTime || lc ? `<div class="meta">${c.visitTime ? '🕑 ' + esc(c.visitTime) : ''}${c.visitTime && lc ? ' · ' : ''}${lc ? '최근 ' + fmtDate(lc) : ''}</div>` : ''}
      </div>
      <button class="btn icon" data-call="${c.phone}">📞</button>
      <button class="btn icon" data-sms="${c.phone}">💬</button>
    </div>`;
  }).join('');
}
$('#list').onclick = e => {
  const t = e.target.closest('[data-open],[data-call],[data-sms]'); if (!t) return;
  if (t.dataset.open) openDetail(t.dataset.open);
  if (t.dataset.call) call(t.dataset.call);
  if (t.dataset.sms) openPicker(t.dataset.sms);
};

// ---------- 고객 상세 ----------
let current = null;
function openDetail(phone) { current = phone; renderDetail(); $('#detail').style.display = 'block'; $('#detail').scrollTop = 0; history.pushState({ d: 1 }, ''); }
function closeDetail() { current = null; $('#detail').style.display = 'none'; renderList(); }
window.onpopstate = () => { if ($('#picker').style.display === 'block') closePicker(); if (current) closeDetail(); };

function renderDetail() {
  const c = findCust(current); if (!c) return;
  const ms = memosOf(c.phone), ab = absentCount(c.phone);
  $('#detail').innerHTML = `
    <header><button id="back">←</button><h1>${esc(nameOf(c))}</h1></header>
    <main>
      <div class="actions" style="margin-bottom:10px">
        <button class="btn primary" id="dCall">📞 전화</button>
        <button class="btn primary" id="dSms">💬 문자</button>
        <button class="btn" id="dAbsent">🚫 부재${ab ? ' ' + ab : ''}</button>
      </div>
      <div class="card">
        <label class="muted">🕑 방문가능시간</label>
        <input id="dVisit" value="${esc(c.visitTime)}" placeholder="예: 평일 오후 2~5시, 토요일 오전">
      </div>
      ${statusCol() ? `<div class="card">
        <label class="muted">진행상태 (${esc(statusCol())})</label>
        <input id="dStatus" value="${esc(c.data[statusCol()])}" list="statusOpts" placeholder="예: 3개 완료, 다음에 연락">
        <datalist id="statusOpts">${[...new Set(S.customers.map(x => x.data[statusCol()]).filter(Boolean))].map(v => `<option value="${esc(v)}">`).join('')}</datalist>
      </div>` : ''}
      <div class="card"><dl class="kv">
        <dt>전화번호</dt><dd>${fmtPhone(c.phone)}</dd>
        ${officeOf(c) ? `<dt>관리사무실</dt><dd><a href="tel:${officeOf(c)}">📞 ${fmtPhone(officeOf(c))}</a></dd>` : ''}
        ${S.columns.filter(k => k !== S.phoneCol && k !== statusCol() && c.data[k] !== '' && c.data[k] != null).map(k => `<dt>${esc(k)}</dt><dd>${esc(c.data[k])}</dd>`).join('')}
      </dl></div>
      <div class="card">
        <div class="row">
          <select id="mType" style="width:100px"><option>전화</option><option>문자</option><option>방문</option><option>부재</option><option>기타</option></select>
          <span class="muted">${fmtDate(new Date().toISOString())}</span>
        </div>
        <textarea id="mText" placeholder="소통한 내용 메모" style="margin-top:6px"></textarea>
        <button class="btn primary" id="mSave" style="width:100%;margin-top:6px">메모 저장</button>
      </div>
      <div class="card">
        <b>소통 기록 (${ms.length})</b>
        ${ms.length ? ms.map(m => `<div class="memo"><button class="del" data-mdel="${m.id}">✕</button>
          <span class="when">${fmtDate(m.date, true)}</span> <span class="badge ${m.type === '부재' ? '' : 'gray'}">${esc(m.type)}</span>
          <div style="white-space:pre-wrap;margin-top:2px">${esc(m.text)}</div></div>`).join('') : '<p class="muted">아직 기록이 없어요.</p>'}
      </div>
    </main>`;
  $('#back').onclick = () => history.back();
  $('#dCall').onclick = () => call(c.phone);
  $('#dSms').onclick = () => openPicker(c.phone);
  $('#dAbsent').onclick = () => { addMemo(c.phone, '부재', '부재 (연락 안 됨)'); renderDetail(); };
  $('#dVisit').onchange = e => { c.visitTime = e.target.value.trim(); save(); };
  if ($('#dStatus')) $('#dStatus').onchange = e => { c.data[statusCol()] = e.target.value.trim(); save(); };
  $('#mSave').onclick = () => {
    const text = $('#mText').value.trim();
    if (!text) return alert('메모 내용을 입력해주세요.');
    addMemo(c.phone, $('#mType').value, text); renderDetail();
  };
  $('#detail').querySelectorAll('[data-mdel]').forEach(b => b.onclick = () => {
    if (!confirm('이 기록을 삭제할까요?')) return;
    S.memos = S.memos.filter(m => m.id !== b.dataset.mdel); save(); renderDetail();
  });
}

function refresh() { if (current) renderDetail(); renderList(); }
function render() { renderTemplates(); renderList(); }
render();
</script>
</body>
</html>
